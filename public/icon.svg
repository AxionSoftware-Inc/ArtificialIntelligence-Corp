<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Dark Tech Radial Glow -->
    <radialGradient id="tensorBg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Cyan Electric Energy Gradient -->
    <linearGradient id="tensorCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Deep Blue Metallic Gradient -->
    <linearGradient id="tensorMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Luminous Bloom Filter -->
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Container Base -->
  <rect width="64" height="64" rx="16" fill="url(#tensorBg)" />
  <rect width="63" height="63" x="0.5" y="0.5" rx="15.5" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1" />

  <!-- 3D Isometric Tensoric Matrix Monolith -->
  <!-- Upper 'T' Horizontal Bar / Top Diamond -->
  <polygon points="32,13 49,22 32,31 15,22" fill="#0c4a6e" stroke="url(#tensorCyan)" stroke-width="1.2" stroke-linejoin="round" />
  
  <!-- Left Side Facet -->
  <polygon points="15,22 32,31 32,50 15,41" fill="url(#tensorMetal)" stroke="#1e293b" stroke-width="0.8" />
  
  <!-- Right Side Facet -->
  <polygon points="32,31 49,22 49,41 32,50" fill="#080e1a" stroke="#1e293b" stroke-width="0.8" />

  <!-- Internal Tensor Neural Lattice Grid / Glowing T-Core -->
  <!-- Central Vertical Spinal Line -->
  <line x1="32" y1="31" x2="32" y2="50" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" filter="url(#bloom)" opacity="0.9" />

  <!-- Cross Tensor Grid Vector -->
  <line x1="15" y1="22" x2="49" y2="22" stroke="#67e8f9" stroke-width="1.8" stroke-linecap="round" filter="url(#bloom)" opacity="0.85" />
  <line x1="32" y1="13" x2="32" y2="31" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" filter="url(#bloom)" opacity="0.85" />

  <!-- Dynamic Tensor Node Vertices (Matrix Points) -->
  <circle cx="32" cy="13" r="2" fill="#ffffff" filter="url(#bloom)" />
  <circle cx="15" cy="22" r="2" fill="#67e8f9" filter="url(#bloom)" />
  <circle cx="49" cy="22" r="2" fill="#67e8f9" filter="url(#bloom)" />
  <circle cx="32" cy="31" r="2.5" fill="#ffffff" filter="url(#bloom)" />
  <circle cx="32" cy="50" r="2" fill="#38bdf8" filter="url(#bloom)" />
</svg>
